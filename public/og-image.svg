<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Developer Security Toolkit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d18"/>
      <stop offset="0.55" stop-color="#0b1320"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="1020" cy="80" r="360" fill="url(#glow)"/>
  <circle cx="160" cy="600" r="300" fill="url(#glow)" opacity="0.6"/>

  <g transform="translate(80, 92)">
    <rect width="72" height="72" rx="18" fill="url(#accent)"/>
    <path d="M36 18 L52 24 L52 38 C52 48 45 54 36 58 C27 54 20 48 20 38 L20 24 Z" fill="#052e22"/>
    <path d="M27 37 L33 43 L46 30" fill="none" stroke="#6ee7b7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="96" y="34" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="0.16em">DEVELOPER SECURITY TOOLKIT</text>
    <text x="96" y="58" fill="#5eead4" font-family="'JetBrains Mono', Menlo, Monaco, Consolas, monospace" font-size="15" letter-spacing="0.08em">100% CLIENT-SIDE · ZERO UPLOADS</text>
  </g>

  <text x="78" y="282" fill="#f8fafc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.8">Developer &amp; security</text>
  <text x="78" y="352" fill="#f8fafc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.8">tools that run in your browser</text>

  <text x="80" y="408" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24">Decode JWTs, format JSON, hash data, test regex, and estimate LLM costs.</text>
  <text x="80" y="442" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24">No account. No server uploads. No tracking of your input.</text>

  <g font-family="'JetBrains Mono', Menlo, Monaco, Consolas, monospace" font-size="16" font-weight="600">
    <rect x="80" y="500" width="136" height="42" rx="21" fill="#0f172a" stroke="#1e293b"/>
    <text x="112" y="527" fill="#6ee7b7">Security</text>

    <rect x="228" y="500" width="140" height="42" rx="21" fill="#0f172a" stroke="#1e293b"/>
    <text x="258" y="527" fill="#67e8f9">Encoding</text>

    <rect x="380" y="500" width="104" height="42" rx="21" fill="#0f172a" stroke="#1e293b"/>
    <text x="412" y="527" fill="#fcd34d">Data</text>

    <rect x="496" y="500" width="150" height="42" rx="21" fill="#0f172a" stroke="#1e293b"/>
    <text x="526" y="527" fill="#a5b4fc">Developer</text>

    <rect x="658" y="500" width="78" height="42" rx="21" fill="#0f172a" stroke="#1e293b"/>
    <text x="685" y="527" fill="#d8b4fe">AI</text>
  </g>

  <text x="1120" y="536" text-anchor="end" fill="#34d399" font-family="'JetBrains Mono', Menlo, Monaco, Consolas, monospace" font-size="18" font-weight="600">securitytoolkit.dev</text>
</svg>
